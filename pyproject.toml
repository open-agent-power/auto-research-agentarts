[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarts-autoresearch"
version = "0.1.0"
description = "Resumable research execution and evaluated model iteration"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
runtime = ["agentarts-sdk==0.1.8"]
sources = ["h5py==3.16.0"]
reports = ["reportlab==4.4.9", "matplotlib==3.11.2", "pypdf==6.10.0"]

[project.scripts]
autoresearch = "autoresearch.cli:main"
autoresearch-runtime = "autoresearch.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["data/*.json.gz", "data/*.md", "web/*.html", "web/*.css", "web/*.js", "web/*.txt"]
